<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1>Iniciar sesión</h1>

  <div class="field">
    <label for="email">Correo</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      [attr.aria-invalid]="showInvalid('email')"
    />
    @if (showInvalid('email')) {
      <p class="field-error" role="alert">Ingresa un correo válido.</p>
    }
  </div>

  <div class="field">
    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [attr.aria-invalid]="showInvalid('password')"
    />
    @if (showInvalid('password')) {
      <p class="field-error" role="alert">La contraseña debe tener al menos 6 caracteres.</p>
    }
  </div>

  @if (errorMessage(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <button type="submit" [disabled]="submitting()">Ingresar</button>

  <p class="auth-alt">¿No tienes cuenta? <a routerLink="/auth/register">Crear una</a></p>
</form>
